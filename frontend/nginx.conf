# Served by nginx-unprivileged, which runs as uid 101 and cannot bind below 1024.
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # config.js is mounted from the ConfigMap at runtime and differs per
    # environment, so it must never be cached.
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options  "nosniff"     always;
    add_header X-Frame-Options         "SAMEORIGIN"  always;
    add_header Referrer-Policy         "no-referrer" always;

    # The microphone is required for voice payments.
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
}
