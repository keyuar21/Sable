# Loki — the log store. One single-binary StatefulSet with filesystem storage is
# the smallest thing that works for a kind cluster. Promtail pushes into it
# (values/promtail.yaml); Grafana queries it through the chart's nginx gateway,
# which is why every client URL below is the `loki-gateway` Service.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    # Keep a week of logs; the compactor deletes anything older.
    retention_period: 168h
    allow_structured_metadata: true
    volume_enabled: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  pattern_ingester:
    enabled: false

# One StatefulSet does every role. The chart's default SimpleScalable mode wants
# three of each (read/write/backend) — pointless here, so they are pinned to 0.
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { memory: 1Gi }

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# No Prometheus, no memcached, no canary in this stack.
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  lokiCanary:
    enabled: false
  serviceMonitor:
    enabled: false
  dashboards:
    enabled: false
  rules:
    enabled: false
