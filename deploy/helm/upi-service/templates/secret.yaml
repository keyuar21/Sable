{{- if and .Values.secret.create (not .Values.existingSecret) }}
{{/*
Convenience only, for local clusters. Real credentials belong in an external
secret manager — set existingSecret instead and leave this disabled.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "upi-service.secretName" . }}
  labels:
    {{- include "upi-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secret.data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
