{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
{{/*
The bank services keep their SQLite ledger here. That file IS the source of
truth for every balance, so it must survive the pod. ReadWriteOnce means one
writer: do not scale a service with persistence enabled past one replica.
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "%s-data" (include "upi-service.fullname" .) }}
  labels:
    {{- include "upi-service.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
{{- end }}
