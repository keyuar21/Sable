# Auth — PIN hashes, WebAuthn passkeys and voice biometrics. Loads the
# Resemblyzer encoder and the AASIST anti-spoof model on boot, which takes a
# while: hence the startup probe and the larger memory ceiling.

image:
  repository: upi-auth
  tag: ""        # defaults to Chart.appVersion

service:
  name: auth
  module: mock_auth.auth_service:app
  port: 5005

replicaCount: 1

# Injected with envFrom, so every key in this secret becomes an environment
# variable. Auth needs the Supabase project: that is where the accounts were
# seeded, and without it sign-in can only see the local SQLite bank.
existingSecret: upi-supabase

env:
  VOICE_BIOMETRICS_DB_PATH: /data/voice_biometrics.db
  # The bank that decides which VPAs exist. Without this the service fell back to
  # http://localhost:5003 — its own container — so every login 404'd with
  # "No account for <vpa>" even for accounts that did exist.
  PAYER_BANK_URL: http://upi-payer-bank:5003
  # WebAuthn is origin-bound: these MUST match the origin the browser uses, or
  # Face ID / Touch ID setup and login fail with a mismatch. The service reads env
  # vars — the app.config.webauthn block below is not wired up yet — so these are
  # the values that actually count.
  WEBAUTHN_RP_ID: upi-sim.local
  WEBAUTHN_ORIGIN: https://upi-sim.local

app:
  config:
    service: auth
    database:
      path: /data/voice_biometrics.db
    pin:
      hash: bcrypt
      max_attempts: 3
      lockout_secs: 900
    webauthn:
      rp_id: upi-sim.local
      rp_name: UPI Simulator
      origin: https://upi-sim.local
    voice:
      model_dir: /opt/models
      encoder: ecapa-tdnn        # resemblyzer kept only as a fallback
      ecapa_cache: /opt/models/ecapa
      antispoof: aasist
      # A fresh random code per attempt is what stops a recorded playback.
      challenge_ttl_secs: 120
      enroll_samples: 3

persistence:
  enabled: true
  mountPath: /data
  size: 1Gi

probes:
  startup:
    enabled: true
    periodSeconds: 5
    failureThreshold: 60    # up to 5 minutes to load the models

resources:
  requests: { cpu: 250m, memory: 768Mi }
  limits:   { memory: 2Gi }

ingress:
  enabled: true
  className: nginx
  # Published as upi-sim.local/api/auth (same origin as the app); the rewrite
  # strips the prefix so the pod still sees /pin/verify, /voice/*, /health.
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    # Voice enrolment posts five WAV samples in one multipart body — about 2.2 MB
    # for 5 x 5s of 48 kHz mono PCM. nginx's default client_max_body_size is 1 MB,
    # so the Ingress answered 413 and the auth service never saw the request: the
    # browser reported "Enrollment failed" and nothing at all appeared in the
    # service logs, which makes this look like a broken recorder. 0 = no limit.
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
  hosts:
    - host: upi-sim.local
      paths:
        - path: /api/auth(/|$)(.*)
          pathType: ImplementationSpecific
  tls:
    - hosts:
        - upi-sim.local
      secretName: upi-sim-tls
