# Bank operations console — read-only back office. Renders the live journal,
# per-bank trial balances and the cross-bank conservation check.
image:
  repository: upi-ops-console
  tag: "1.0.6"   # ledger via bank HTTP mirrors + agent cross-origin call
  # The AKS deploy script deploys the moving "<image>-latest" tag, so the node
  # must re-check the registry; IfNotPresent would keep a stale cached layer.
  pullPolicy: Always

service:
  name: ops-console
  module: ops_console.ops_service:app
  port: 5010

replicaCount: 1

app:
  config:
    service: ops-console
    # NOTE: today the console opens each bank's SQLite file directly in
    # read-only mode. That works on one host but not across pods — a pod cannot
    # read another pod's volume. Before this runs in a cluster the console has
    # to read over HTTP instead (each bank already exposes
    # /ledger/trial-balance), or share a ReadWriteMany volume. Both options are
    # left here; `mode` picks one.
    mode: http            # http | sqlite
    banks:
      - code: MOCKBANK
        label: Remitter Bank (payer side)
        url: http://upi-payer-bank:5003
        sqlite_path: /data/payer/payer_ledger.db
      - code: MOCKBANK2
        label: Beneficiary Bank (payee side)
        url: http://upi-payee-bank:5004
        sqlite_path: /data/payee/payee_ledger.db
    refresh_secs: 2.5

# HTTP Basic enforced by the console app itself (every route except /health),
# so it survives any ingress controller. Change the password before exposing
# this beyond a demo:  --set env.OPS_BASIC_PASS='...'
env:
  OPS_BASIC_USER: admin
  OPS_BASIC_PASS: admin

ingress:
  enabled: true
  className: nginx
  annotations:
    # Diagnose can take ~60s (LLM rounds + sandbox). nginx's default 60s
    # proxy_read_timeout cuts the request at exactly the boundary.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "180"
  hosts:
    # No host on purpose: the rule matches every hostname, so /ops works on
    # upi-sim.local (kind) and on a bare public IP (AKS) without edits.
    #
    # PLAIN PREFIX, NO REWRITE. The console serves /ops itself (the app mounts
    # every route twice), and browsers ask for /ops/api/... . The old
    # regex+rewrite form depended on nginx-only annotations and, with
    # ingress.enabled=false, /ops fell through to the frontend's "/" rule —
    # which is why the customer app appeared instead of this console.
    - paths:
        - path: /ops
          pathType: Prefix
  tls:
    - hosts:
        - upi-sim.local
      secretName: upi-sim-tls

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits:   { memory: 256Mi }
