# Customer app — static files. No Python here; nginx serves the bundle, so the
# chart's uvicorn entrypoint is replaced wholesale by `command`.
image:
  repository: upi-frontend
  tag: ""        # defaults to Chart.appVersion

service:
  name: frontend
  module: ""          # not a uvicorn service
  port: 8080

replicaCount: 2


command: ["nginx", "-g", "daemon off;"]

app:
  config:
    service: frontend
    features:
      voice_payments: true
      device_binding: true

  # The browser cannot read a mounted YAML file, so the frontend's real config
  # ships as a JavaScript file mounted straight into the web root. The values are
  # RELATIVE, same-origin paths: the browser talks to the host it loaded the app
  # from (upi-sim.local/api/...) — the cert it already trusts, and no CORS. The
  # nginx rewrite in each service's values file strips /api/<svc> before the
  # request reaches the pod.
  extraFiles:
    config.js: |
      window.__UPI_CONFIG__ = {
        psp:       '/api/psp',
        switch:    '/api/switch',
        payerBank: '/api/payer',
        payeeBank: '/api/payee',
        auth:      '/api/auth',
        recharge:  '/api/recharge',
      };

extraVolumes:
  - name: webconfig
    configMap:
      name: upi-frontend-config
extraVolumeMounts:
  - name: webconfig
    mountPath: /usr/share/nginx/html/config.js
    subPath: config.js
    readOnly: true

probes:
  path: /

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101        # nginx-unprivileged
  runAsGroup: 101
  fsGroup: 101

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: upi-sim.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - upi-sim.local
      secretName: upi-sim-tls

resources:
  requests: { cpu: 25m, memory: 64Mi }
  limits:   { memory: 128Mi }
