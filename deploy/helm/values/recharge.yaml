# Recharge / biller — detects a number's operator and serves its prepaid plans.
image:
  repository: upi-recharge
  tag: ""        # defaults to Chart.appVersion

service:
  name: recharge
  module: mock_recharge.recharge_service:app
  port: 5007

replicaCount: 1   # ReadWriteOnce volume holds the lookup cache

app:
  config:
    service: recharge
    database:
      path: /data/recharge.db
    carrier_lookup:
      provider: veriphone
      endpoint: https://api.veriphone.io/v2/verify
      # The key is NEVER in this file. It comes from the secret below, so it
      # stays out of git and out of any rendered manifest.
      cache_days: 30
      # Veriphone's static mode reports the operator that originally held the
      # number range, so a ported number shows its old operator.
      mode: static
    plans:
      # builtin -> the sample catalogue shipped with the service.
      # rapidapi -> live tariffs from nixinfo via RapidAPI. That needs BOTH
      # RAPIDAPI_KEY and NIXINFO_CTRLKEY in the secret below; without both the
      # service stays on builtin rather than failing.
      source: builtin
      cache_hours: 24
      operators: [jio, airtel, vi, bsnl]
    reminders:
      # How far ahead to warn that a plan is running out.
      window_days: 5

# Create this secret out of band. Keys never belong in a values file.
#   kubectl -n upi create secret generic upi-recharge-keys \
#     --from-literal=VERIPHONE_API_KEY=... \
#     --from-literal=PLAN_PROVIDER=rapidapi \
#     --from-literal=RAPIDAPI_KEY=... \
#     --from-literal=NIXINFO_CTRLKEY=...
existingSecret: upi-recharge-keys

persistence:
  enabled: true
  mountPath: /data
  size: 1Gi

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits:   { memory: 256Mi }
